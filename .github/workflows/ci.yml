name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Playwright 1.55.1 cannot install Chromium dependencies on Ubuntu 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:check
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
